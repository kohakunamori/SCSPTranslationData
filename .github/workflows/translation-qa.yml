name: Translation QA

on:
  push:
    branches:
      - TransData
  pull_request:
    branches:
      - TransData
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch DumpData reference
        shell: bash
        run: |
          git fetch --no-tags origin DumpData:refs/remotes/origin/DumpData

      - name: Run QA unit tests
        run: |
          python -m unittest discover -s tools -p "test_*.py"

      - name: Run translation QA
        run: |
          python tools/qa.py             --report qa-report.json             --markdown-report qa-report.md

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f qa-report.md ]; then
            cat qa-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-qa-report
          path: |
            qa-report.json
            qa-report.md
          if-no-files-found: ignore
